name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test suite
        # Runs in a throwaway HOME with OMA_CAFFE_HEADLESS=1; Omarchy validator
        # is skipped when `omarchy` is not installed on the runner.
        run: bash test/run
